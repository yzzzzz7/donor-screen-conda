name: Public VCF smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - test/**
      - '!test/expected/outputs/**'
      - src/**
      - linux-64/**
      - .github/workflows/public-vcf-smoke.yml
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: donor-smoke
          python-version: "3.11"
          channels: conda-forge,bioconda
          channel-priority: strict
      - name: Install the public Conda build and workbook verifier
        shell: bash -el {0}
        run: |
          conda install -y -c conda-forge -c bioconda openpyxl
          conda install -y -c https://raw.githubusercontent.com/yzzzzz7/donor-screen-conda/main -c conda-forge -c bioconda donor-screen=0.2.5
      - name: Run the packaged workflow and open all workbooks
        shell: bash -el {0}
        run: |
          bash test/run.sh "$RUNNER_TEMP/donor-example"
          python - <<'PYTHON'
          import os
          from pathlib import Path
          from openpyxl import load_workbook
          root = Path(os.environ["RUNNER_TEMP"]) / "donor-example/result"
          for folder, rows in (("01_selection", 2), ("02_pairings", 2), ("03_combinations", 3)):
              book = load_workbook(root / folder / "results.xlsx", read_only=True)
              assert book.active["A1"].font.name == "Times New Roman"
              observed = list(book.active.values)
              assert len(observed) == rows + 1
              assert observed[0][0] == "Donor count"
              assert isinstance(observed[1][0], int)
              book.close()
          PYTHON
      - name: Test the optional fourth metric on synthetic annotations
        shell: bash -el {0}
        run: |
          base="$RUNNER_TEMP/donor-example"
          {
            printf 'chrom\tpos\tref\talt\tmissense\n'
            bcftools query -f '%CHROM\t%POS\t%REF\t%ALT\n' "$base/fragment.vcf.gz" |
              awk 'BEGIN {OFS="\t"} {print $0, NR % 2}'
          } > "$base/synthetic-cds.tsv"
          donor-screen "$base/fragment.vcf.gz" "$base/roles.tsv" --out "$base/r-result" \
            --offspring 1 --threads 2 --java-memory 2g --cds-sites "$base/synthetic-cds.tsv" \
            --froh-bed test/input/autosomes.bed --froh-chr-set 22 --froh-replicates 16
          python - <<'PYTHON'
          import csv
          import json
          import math
          import os
          from pathlib import Path
          from openpyxl import load_workbook
          base = Path(os.environ["RUNNER_TEMP"]) / "donor-example"
          out = base / "r-result"
          original = json.loads((base / "result/results.json").read_text())
          result = json.loads((out / "results.json").read_text())
          assert result["cohort"]["missense_policy"] == "report"
          assert [r["donors"] for r in result["results"]] == [r["donors"] for r in original["results"]]
          with (out / "coding-pairs.tsv").open() as source:
              counts = {frozenset((row["sample1"], row["sample2"])): float(row["expected_missense"]) / float(row["expected_cds"])
                        for row in csv.DictReader(source, delimiter="\t")}
          for row in result["results"]:
              pair, = row["pairs"]
              assert 0 < row["r"] < 1
              assert math.isclose(row["r"], counts[frozenset((pair["parent1"], pair["parent2"]))])
          workbook = load_workbook(out / "01_selection/results.xlsx", read_only=True)
          assert "Predicted homozygous missense proportion R" in next(workbook.active.values)
          workbook.close()
          assert (out / "01_selection/missense-r.svg").exists()
          page = (out / "report.html").read_text()
          assert page.count("<svg ") == 10
          assert "Predicted offspring FROH" in page and "后代 FROH 预测" in page
          assert 'id="chinese" lang="zh-CN" hidden' in page
          by_donor = {}
          for row in result["pairwise"]:
              by_donor.setdefault(row["donor"], set()).add(row["rare"])
          assert len(result["pairwise"]) == 18
          assert all(len(v) == 1 for v in by_donor.values())
          table = load_workbook(out / "05_pairwise/results.xlsx", read_only=True)
          pair_rows = list(table.active.values)
          assert pair_rows[0][:2] == ("Recipient", "Donor")
          assert "one F1" in pair_rows[0][2] and "one F1" in pair_rows[0][3]
          assert len(pair_rows) == 19 and any(row[-1] for row in pair_rows[1:])
          table.close()
          prediction = result["predicted_froh"]
          assert prediction["replicates_per_pair"] == 16
          assert {p["plan"] for p in prediction["plans"]} == {"No introduction", "Selected", "High-heterozygosity reference"}
          assert all(p["total_high"] >= p["total_low"] >= 0 and p["long"] == 0 for p in prediction["plans"])
          assert all(0 <= p["r"] <= 1 for p in prediction["plans"])
          book = load_workbook(out / "04_predicted_froh/results.xlsx", read_only=True)
          assert len(list(book.active.values)) == 4
          book.close()
          PYTHON
      - name: Run the original PLINK ROH method on observed example genotypes
        shell: bash -el {0}
        run: |
          base="$RUNNER_TEMP/donor-example"
          bcftools index "$base/fragment.vcf.gz"
          bcftools query -l "$base/fragment.vcf.gz" > "$base/observed-samples.txt"
          printf '22\t0\t51304566\n' > "$base/autosomes.bed"
          donor-screen froh "$base/fragment.vcf.gz" "$base/observed-samples.txt" \
            "$base/autosomes.bed" --chr-set 22 --out "$base/observed-roh"
          python - <<'PYTHON'
          import csv
          import math
          import os
          from pathlib import Path
          from openpyxl import load_workbook
          out = Path(os.environ["RUNNER_TEMP"]) / "donor-example/observed-roh"
          with (out / "froh.tsv").open() as f:
              rows = list(csv.DictReader(f, delimiter="\t"))
          assert len(rows) == 12
          lines = (out / "roh.hom").read_text().splitlines()
          segments = [dict(zip(lines[0].split(), line.split())) for line in lines[1:]]
          for row in rows:
              lengths = [float(s["KB"]) for s in segments if s["IID"] == row["sample"]]
              assert int(row["reference_bp"]) == 51304566
              assert math.isclose(float(row["FROH_100kb"]), sum(lengths) * 1000 / 51304566)
              assert float(row["FROH_gt1Mb"]) == 0
          book = load_workbook(out / "froh.xlsx", read_only=True)
          assert len(list(book.active.values)) == 13
          book.close()
          PYTHON
      - name: Collect the publication example
        shell: bash -el {0}
        run: |
          base="$RUNNER_TEMP/donor-example"
          bundle="$RUNNER_TEMP/public-example"
          mkdir -p "$bundle/input" "$bundle/outputs"
          cp "$base"/{synthetic-cds.tsv,observed-samples.txt,autosomes.bed} "$bundle/input/"
          for pair in result:01_screen r-result:02_screen_with_R; do
            source="$base/${pair%:*}"
            dest="$bundle/outputs/${pair#*:}"
            mkdir -p "$dest"
            cp "$source"/{report.html,results.csv,results.json} "$dest/"
            cp -r "$source"/0[1235]_* "$dest/"
            if [[ -d "$source/04_predicted_froh" ]]; then
              cp -r "$source/04_predicted_froh" "$dest/"
            fi
          done
          python test/observed-report.py "$base/observed-roh"
          mkdir "$bundle/outputs/03_observed_froh"
          cp "$base/observed-roh"/{report.html,froh.xlsx,froh.tsv,froh.svg,roh.hom} "$bundle/outputs/03_observed_froh/"
      - uses: actions/upload-artifact@v4
        with:
          name: public-example
          path: ${{ runner.temp }}/public-example/
      - name: Show stage logs on failure
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          for f in "$RUNNER_TEMP"/donor-example/result/*.log; do
            printf '\n=== %s ===\n' "$f"
            tail -n 20 "$f"
          done
