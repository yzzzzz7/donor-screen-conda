name: Public VCF smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - test/**
      - '!test/expected/outputs/**'
      - src/**
      - linux-64/**
      - .github/workflows/public-vcf-smoke.yml
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: donor-smoke
          python-version: "3.11"
          channels: conda-forge,bioconda
          channel-priority: strict
      - name: Install the public Conda build and workbook verifier
        shell: bash -el {0}
        run: |
          conda install -y -c conda-forge -c bioconda openpyxl
          conda install -y -c https://raw.githubusercontent.com/yzzzzz7/donor-screen-conda/main -c conda-forge -c bioconda donor-screen=0.2.9
      - name: Run the documented synthetic example
        shell: bash -el {0}
        run: |
          donor-screen test/input/synthetic-contrast.vcf.gz test/input/roles.tsv --froh-bed test/input/autosomes.bed --cds-sites test/input/synthetic-cds.tsv --froh-chr-set 1 -k 2 -n 3 -r 50 -t 2 --java-memory 2g --out demo-two-donors
          python - <<'PYTHON'
          import csv
          import json
          import math
          from pathlib import Path
          from openpyxl import load_workbook

          root = Path("demo-two-donors")
          data = json.loads((root / "results.json").read_text())
          control, selected = data["results"]
          print({key: selected.get(key) for key in ("donors", "reference_donors", "rare", "reference_rare", "het", "reference_het", "hbd", "cap")})
          assert [entry["k"] for entry in data["results"]] == [0, 2]
          assert data["cohort"]["offspring_count"] == 3
          assert len(selected["donors"]) == len(selected["reference_donors"]) == 2
          assert len(control["pairs"]) == len(selected["pairs"]) == len(selected["reference_pairs"]) == 3
          assert selected["donors"] != selected["reference_donors"]
          assert selected["rare"] >= 1.25 * selected["reference_rare"] > 0
          assert selected["hbd"] <= selected["cap"]
          assert data["predicted_froh"]["replicates_per_pair"] == 50
          assert data["predicted_froh"]["all_recipient_donor_pairs"]
          assert all(plan["r"] is not None for plan in data["predicted_froh"]["plans"])
          with (root / "king.kin0").open() as f:
              fields = f.readline().lstrip("#").split()
              king = {}
              for line in f:
                  row = dict(zip(fields, line.split()))
                  key = frozenset((row.get("IID1", row.get("ID1")), row.get("IID2", row.get("ID2"))))
                  king[key] = float(row.get("KINSHIP", row.get("Kinship")))
          book = load_workbook(root / "05_pairwise/results.xlsx", read_only=True)
          header, *rows = list(book.active.values)
          assert header[:3] == ("KING kinship coefficient (parents)", "Recipient", "Donor")
          assert len(rows) == 18 and len({tuple(row[1:3]) for row in rows}) == 18
          assert all(row[-1] == 50 and math.isclose(row[0], king[frozenset(row[1:3])]) for row in rows)
          h = [row[header.index("Expected SNP heterozygosity of one F1 (%)")] for row in rows]
          total = [row[header.index("Froh total (%)")] for row in rows]
          long = [row[header.index("Froh long (>1 Mb) (%)")] for row in rows]
          print("SNP heterozygosity range:", min(h), max(h))
          print("FROH ranges:", (min(total), max(total)), (min(long), max(long)))
          print("Nonzero total and long FROH:", sum(value > 0 for value in total), sum(value > 0 for value in long))
          assert 0 < min(h) <= max(h) <= 28
          assert all(0 <= l <= t <= 100 for l, t in zip(long, total))
          assert 0 < max(total) and 0 < max(long) and min(long) < max(long)
          book.close()
          with (root / "04_predicted_froh/simulated-f1-froh.tsv").open() as f:
              counts = {}
              for row in csv.DictReader(f, delimiter="\t"):
                  key = (row["parent1"], row["parent2"])
                  counts[key] = counts.get(key, 0) + 1
          assert counts and set(counts.values()) == {50}
          html = (root / "report.html").read_text()
          assert 'id="chinese" lang="zh-CN" hidden' in html
          PYTHON
      - name: Check the basic screen and observed ROH with the same VCF
        shell: bash -el {0}
        run: |
          base="$RUNNER_TEMP/single-fixture"
          mkdir "$base"
          cp test/input/synthetic-contrast.vcf.gz "$base/fixture.vcf.gz"
          donor-screen "$base/fixture.vcf.gz" test/input/roles.tsv -n 1 --max-donors 1 -t 2 --java-memory 2g --out "$base/basic"
          bcftools index "$base/fixture.vcf.gz"
          bcftools query -l "$base/fixture.vcf.gz" > "$base/samples.txt"
          donor-screen froh "$base/fixture.vcf.gz" "$base/samples.txt" test/input/autosomes.bed --chr-set 1 --out "$base/observed"
          python - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          from openpyxl import load_workbook
          base = Path(os.environ["RUNNER_TEMP"]) / "single-fixture"
          result = json.loads((base / "basic/results.json").read_text())
          assert [row["k"] for row in result["results"]] == [0, 1]
          assert "predicted_froh" not in result
          assert all(row["r"] is None for row in result["pairwise"])
          book = load_workbook(base / "observed/froh.xlsx", read_only=True)
          assert len(list(book.active.values)) == 13
          book.close()
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-example
          if-no-files-found: error
          path: |
            demo-two-donors/report.html
            demo-two-donors/results.json
            demo-two-donors/05_pairwise/results.xlsx
      - name: Show stage logs on failure
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          for f in demo-two-donors/*.log; do
            printf '\n=== %s ===\n' "$f"
            tail -n 20 "$f"
          done
