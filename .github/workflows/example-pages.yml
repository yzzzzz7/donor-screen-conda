name: Publish example reports
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - test/expected/outputs/**
      - .github/workflows/example-pages.yml
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: test/expected/outputs
      - uses: actions/deploy-pages@v4
        id: deployment
