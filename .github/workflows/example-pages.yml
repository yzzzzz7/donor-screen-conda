name: Publish example reports
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - test/expected/outputs/**
      - .github/workflows/example-pages.yml
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: test/expected/outputs
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the example reports
        uses: actions/deploy-pages@v4
        id: deployment
        continue-on-error: true
      - name: Wait before retrying access to the uploaded artifact
        if: steps.deployment.outcome == 'failure'
        run: sleep 15
      - name: Retry the deployment
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        id: retry
