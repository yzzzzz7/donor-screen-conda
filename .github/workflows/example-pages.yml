name: Publish example reports
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - test/expected/outputs/**
      - .github/workflows/example-pages.yml
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: test/expected/outputs

      - name: Wait for the Pages artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..10}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].name' | grep -qx github-pages; then
              exit 0
            fi
            sleep 5
          done
          echo "The Pages artifact was uploaded but is not visible in the Actions API." >&2
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
